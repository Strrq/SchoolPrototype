<h1>Welcome, Student!</h1>
<h3>📚 Your Homework:</h3>
<ul id="homeworkList"></ul>
<h3>🗓️ Your Schedule:</h3>
<ul id="scheduleList"></ul>
<link rel="stylesheet" href="style.css">
<script src="firebase.js"></script>
<script>
firebase.database().ref("homework").on("value", snapshot => {
  document.getElementById("homeworkList").innerHTML = "";
  snapshot.forEach(child => {
    const li = document.createElement("li");
    li.textContent = child.val();
    document.getElementById("homeworkList").appendChild(li);
  });
});
firebase.database().ref("schedule").on("value", snapshot => {
  document.getElementById("scheduleList").innerHTML = "";
  snapshot.forEach(child => {
    const li = document.createElement("li");
    li.textContent = child.val();
    document.getElementById("scheduleList").appendChild(li);
  });
});
</script>
